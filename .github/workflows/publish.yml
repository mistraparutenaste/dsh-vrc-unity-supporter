name: publish

# Manual only: a tag push would run this on every release even before NPM_TOKEN exists,
# leaving red runs on a repository that friends browse. Run it from the Actions tab
# (Actions > publish > Run workflow) after setting the NPM_TOKEN repository secret.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the packed file list
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
